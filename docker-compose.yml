version: '3.8'

services:
  medical-chatbot:
    build: .
    ports:
      - "8040:8040"
    volumes:
      - ./medicalchatbot/uploads:/app/uploads
      - ./medicalchatbot/reports:/app/reports
      - ./medicalchatbot/faiss_index:/app/faiss_index
      - ./medicalchatbot/logs:/app/logs
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/"]
      interval: 30s
      timeout: 10s
      retries: 3